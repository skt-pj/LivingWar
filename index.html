<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>LivingWar - 魔王軍プロトタイプ</title>
  <link rel="stylesheet" href="styles.css?v=paint6" />
</head>
<body>
  <main class="app-shell">
    <section class="screen-column">
      <div class="screen-frame" aria-label="Dungeon editor">
        <div class="canvas-viewport" id="canvasViewport">
          <canvas id="game" width="160" height="144"></canvas>
        </div>
      </div>
      <div class="screen-toolbar">
        <div class="screen-help" id="screenHelp">軍勢を選択してください。</div>
        <button id="zoomResetButton" class="small-button hidden" type="button">表示を戻す</button>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div id="startPanel" class="panel-section">
        <h1>LivingWar</h1>
        <p>軍勢を選択</p>
        <button class="menu-button disabled" id="heroButton" type="button">勇者軍</button>
        <button class="menu-button primary" id="maouButton" type="button">魔王軍</button>
        <p class="note">今回は魔王軍のみ実装。</p>
      </div>

      <div id="editorPanel" class="panel-section hidden">
        <div class="panel-head">
          <div>
            <h1>ダンジョン製作</h1>
            <p>1F / 20×16マス</p>
          </div>
          <button id="backButton" class="small-button" type="button">戻る</button>
        </div>

        <div class="status-grid">
          <span>配置モンスター</span><strong id="monsterCount">0</strong>
          <span>配置罠</span><strong id="trapCount">0</strong>
          <span>シミュレーション</span><strong id="simState">停止</strong>
        </div>

        <h2>地形</h2>
        <div class="tool-grid">
          <button class="tool-button active" data-tool="floor" type="button">床</button>
          <button class="tool-button" data-tool="wall" type="button">壁</button>
          <button class="tool-button" data-tool="erase" type="button">消去</button>
        </div>

        <h2>設備</h2>
        <div class="tool-grid two-column">
          <button class="tool-button" data-tool="entrance" type="button">入口</button>
          <button class="tool-button" data-tool="stairs" type="button">次の階段</button>
        </div>

        <h2>モンスター</h2>
        <div class="tool-grid two-column">
          <button class="tool-button" data-tool="slime" type="button">スライム</button>
          <button class="tool-button" data-tool="goblin" type="button">ゴブリン</button>
        </div>

        <h2>罠</h2>
        <div class="tool-grid one-column">
          <button class="tool-button" data-tool="trap" type="button">トゲ罠</button>
        </div>

        <div class="info-card" id="toolInfo"></div>

        <div class="action-row">
          <button id="simulateButton" class="menu-button compact primary" type="button">徘徊テスト開始</button>
          <button id="resetButton" class="menu-button compact" type="button">初期化</button>
        </div>
        <div class="action-row">
          <button id="saveButton" class="menu-button compact" type="button">設計保存</button>
          <button id="loadButton" class="menu-button compact" type="button">設計読込</button>
        </div>

        <p class="note">ゲーム画面はGBモード。入口から出口への通路を塞ぐ壁は配置できません。モンスター・罠は通路上や入口・出口にも配置可能です。ピンチで拡大・縮小、長押し移動で連続設置できます。</p>
      </div>
    </aside>
  </main>

  <script src="game.js?v=route7"></script>
</body>
</html>
